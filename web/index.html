<!doctype html>
<html lang="es" data-style="wheel" data-mode="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Un set no es una lista de buenos temas: es una curva. Planifica sets de DJ con rueda Camelot y curva de BPM y energía." />
  <title>Set Planifier</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1226'/%3E%3Cpath d='M5 22 C10 22 11 10 16 10 S22 22 27 22' fill='none' stroke='%237C8CFF' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    // Apply the saved look before first paint, so there is no flash of the wrong theme.
    (function () {
      try {
        var s = localStorage.getItem('sp-style');
        var m = localStorage.getItem('sp-mode');
        var d = document.documentElement;
        if (s === 'console' || s === 'editorial' || s === 'wheel') d.setAttribute('data-style', s);
        if (m !== 'light' && m !== 'dark') m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        d.setAttribute('data-mode', m);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
